<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Noxis — Your cameras. Your recordings.</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head><body>
<aside><a class="brand" href="/" aria-label="Noxis"><span class="brand-mark">◉</span> NOXIS</a><p class="brand-sub" data-i18n="tagline"></p><nav><button data-view="live" class="active" data-i18n="live"></button><button data-view="archives" data-i18n="archives"></button><button data-view="exports" data-i18n="exports"></button><button data-view="settings" data-i18n="settings"></button></nav><div class="aside-footer"><span class="dot"></span><span data-i18n="local"></span><small id="host-label"></small></div></aside>
<main><header><div><span class="eyebrow">NOXIS / </span><span id="page-heading"></span></div><div class="header-actions"><span id="connection" class="status"></span><label class="sr-only" for="language">Language</label><select id="language"><option value="fr">Français</option><option value="en">English</option></select><button id="logout" class="secondary" data-i18n="logout" hidden></button></div></header>
<div id="notice" role="status" aria-live="polite" hidden></div>
<section id="login" class="card" hidden><h1 data-i18n="connect"></h1><form id="login-form"><label><span data-i18n="username"></span><input id="username" autocomplete="username" value="admin" required></label><label><span data-i18n="password"></span><input id="password" type="password" autocomplete="current-password" required></label><button data-i18n="connect"></button></form></section>
<div id="application" hidden>
<section id="view-live" class="view"><div class="intro"><div><p class="eyebrow" data-i18n="liveEyebrow"></p><h1 data-i18n="liveTitle"></h1><p data-i18n="liveSubtitle"></p></div><div class="toolbar"><button id="start-all" data-i18n="startAll"></button><button id="stop-all" class="secondary" data-i18n="stopAll"></button></div></div><div id="camera-grid" class="camera-grid"></div><p class="hint" data-i18n="liveNote"></p></section>
<section id="view-archives" class="view" hidden><div class="intro"><div><p class="eyebrow" data-i18n="archivesEyebrow"></p><h1 data-i18n="archivesTitle"></h1><p id="history-description"></p></div><button id="browse-day" class="secondary" data-i18n="browseDay"></button></div><form id="search-form" class="card"><div class="filters"><label><span data-i18n="date"></span><input id="date" type="date" required></label><label><span data-i18n="from"></span><input id="from" type="time" step="1" value="00:00:00" required></label><label><span data-i18n="until"></span><input id="until" type="time" step="1" value="23:59:59" required></label><fieldset class="camera-filter-field"><legend data-i18n="camera"></legend><div id="camera-filter"></div></fieldset></div><div class="filter-bottom"><fieldset><legend data-i18n="events"></legend><label class="chip"><input name="event" type="checkbox" checked value="Timing"><span data-i18n="continuous"></span></label><label class="chip"><input name="event" type="checkbox" checked value="Motion"><span data-i18n="motion"></span></label><label class="chip"><input name="event" type="checkbox" checked value="Alarm"><span data-i18n="alarm"></span></label><label class="chip"><input name="event" type="checkbox" checked value="Manual"><span data-i18n="manual"></span></label></fieldset><button id="search-button" data-i18n="search"></button></div></form><section class="card"><div class="section-heading"><h2><span data-i18n="recordings"></span> <span class="count" id="record-count">0</span></h2><div class="toolbar"><button id="clear-selection" class="secondary" data-i18n="clearSelection" disabled></button><button id="download-selection" disabled></button><button id="csv" class="secondary" data-i18n="csv" disabled></button></div></div><div class="table-wrap"><table><thead><tr><th><input id="select-page" type="checkbox"></th><th data-i18n="camera"></th><th data-i18n="event"></th><th data-i18n="start"></th><th data-i18n="end"></th><th data-i18n="duration"></th><th data-i18n="actions"></th></tr></thead><tbody id="records"></tbody></table></div><div id="empty" class="empty" data-i18n="noRecords"></div><div class="pagination"><label><span data-i18n="pageSize"></span><select id="page-size"><option>25</option><option>50</option><option>100</option></select></label><span id="page-label"></span><div><button id="previous" class="secondary">←</button><button id="next" class="secondary">→</button></div></div></section></section>
<section id="view-exports" class="view" hidden><div class="intro"><div><p class="eyebrow">MP4 / H.264 / H.265</p><h1 data-i18n="exportsTitle"></h1><p data-i18n="exportsSubtitle"></p></div></div><div id="export-list"></div><div id="exports-empty" class="card empty" data-i18n="exportsEmpty"></div></section>
<section id="view-settings" class="view" hidden><div class="intro"><div><p class="eyebrow">DOCKER / API / FTP</p><h1 data-i18n="settingsTitle"></h1><p data-i18n="settingsSubtitle"></p></div><button id="refresh-info" class="secondary" data-i18n="refresh"></button></div><section class="card"><h2 data-i18n="device"></h2><dl id="device-info"></dl><details><summary data-i18n="details"></summary><pre id="device-json"></pre></details></section><section class="card"><h2 data-i18n="virtualFtp"></h2><p data-i18n="ftpDescription"></p><pre id="ftp-example"></pre><p class="hint" data-i18n="ftpHint"></p></section></section>
</div><footer class="footnote">NOXIS 1.1 · <span data-i18n="footer"></span></footer></main>
<dialog id="export-dialog"><form id="export-form"><p class="eyebrow" data-i18n="recordedArchive"></p><h2 id="export-title"></h2><p id="export-caption"></p><div class="filters two"><label><span data-i18n="offset"></span><input id="offset" type="number" min="0" value="0" step="1" required></label><label><span data-i18n="seconds"></span><input id="seconds" type="number" min="1" max="3600" step="1" required></label></div><p class="hint" data-i18n="formatNote"></p><div class="dialog-actions"><button type="button" id="close-dialog" class="secondary" data-i18n="close"></button><button id="prepare-button" data-i18n="prepare"></button></div></form></dialog>
<dialog id="player-dialog"><div class="section-heading"><h2 id="player-title"></h2><button id="close-player" class="secondary" data-i18n="close"></button></div><video id="archive-player" controls playsinline></video></dialog>
</body></html>
