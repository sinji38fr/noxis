services:
  noxis:
    image: shinji38fr/noxis:latest
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
      - "127.0.0.1:2121:2121"
      - "127.0.0.1:50000-50009:50000-50009"
    environment:
      # Address and credentials stay in YOUR deployment, never in the image.
      NVR_HOST: ${NVR_HOST:?Set NVR_HOST in .env}
      NVR_HTTP_PORT: ${NVR_HTTP_PORT:-80}
      NVR_VIDEO_PORT: ${NVR_VIDEO_PORT:-10000}
      NVR_USERNAME: ${NVR_USERNAME:-admin}
      NVR_PASSWORD: ${NVR_PASSWORD:?Set NVR_PASSWORD in .env}
      EXPORT_CONCURRENCY: ${EXPORT_CONCURRENCY:-1}
      ARCHIVE_DAYS: ${ARCHIVE_DAYS:-30}
      # Optional reverse-proxy URI, for example https://home.example/noxis/
      PUBLIC_URL: ${PUBLIC_URL:-}
      BASE_PATH: ${BASE_PATH:-}
      # Optional number of tiles in the live view, not used to create FTP folders.
      NVR_CHANNELS: ${NVR_CHANNELS:-4}
      FTP_ENABLED: ${FTP_ENABLED:-true}
      FTP_USERNAME: ${FTP_USERNAME:-noxis}
      FTP_PASSWORD: ${FTP_PASSWORD:?Set FTP_PASSWORD in .env}
      FTP_PASV_ADDRESS: ${FTP_PASV_ADDRESS:-127.0.0.1}
      FTP_PASV_MIN: 50000
      FTP_PASV_MAX: 50009
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      NOXIS_API_TOKEN: ${NOXIS_API_TOKEN:-}
      TZ: ${TZ:-Europe/Paris}
    read_only: true
    tmpfs:
      - /tmp:size=3g,uid=1000,gid=1000,mode=1700
    security_opt:
      - no-new-privileges:true
